[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bivouac"
version = "0.1.0"
description = "LLM Bivouac proxy and deployment controller"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
llm-bivouac-proxy = "llm_bivouac.__main__:main"
bivouac = "llm_bivouac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
